# Quality gate on every push and pull request: lint, format check, type check and build.
# Deployment itself is done by Cloudflare Workers Builds (see docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

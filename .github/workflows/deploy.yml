# Build the site and deploy dist/ to the Plesk web root (/marioschoch.ch) over FTPS or SFTP.
#
# Runs on every push to main, or manually (Actions → Deploy → Run workflow), where you can
# pick an older commit/tag to roll back to, or force a full upload.
#
# Required repository secrets (Settings → Secrets and variables → Actions), see docs/DEPLOYMENT.md:
#   DEPLOY_PROTOCOL (ftps | sftp), DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_REMOTE_PATH
#   FTPS: DEPLOY_PASSWORD
#   SFTP (in use, venus.kreativmedia.ch:2121): DEPLOY_KNOWN_HOSTS + DEPLOY_PRIVATE_KEY (or DEPLOY_PASSWORD),
#   optional DEPLOY_PASSPHRASE
# Optional: PUBLIC_CF_ANALYTICS_TOKEN
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, tag or branch to deploy (empty = latest main). Use an older SHA to roll back.'
        required: false
        default: ''
      full:
        description: 'Upload every file, not just the changed ones'
        type: boolean
        default: false

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://marioschoch.ch
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: PHP syntax check (Snake leaderboard API)
        run: php -l public/api/snake-scores.php

      - name: Build (type check + static build + CSP hashes)
        run: npm run build
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}

      - name: Deploy to web root
        run: node scripts/deploy.mjs ${{ inputs.full && '--full' || '' }}
        env:
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}

      - name: Smoke test
        run: |
          for path in / /projects/ /cv/ /de/ /rss.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://marioschoch.ch$path")
            echo "$path → $code"
            [ "$code" = "200" ] || exit 1
          done
          # The leaderboard API must run PHP and answer with JSON.
          curl -sf https://marioschoch.ch/api/snake-scores.php | grep -q '"scores"' \
            || { echo "Snake leaderboard API is not answering with JSON"; exit 1; }
